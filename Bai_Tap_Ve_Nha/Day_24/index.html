<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @layer utilities {
            .bg-custom-dark {
                background-color: #1A1A40;
            }

            .bg-custom-light {
                background-color: #8758FF;
            }

            .bg-custom-input {
                background-color: #1A1A40;
            }

            .bg-custom-item {
                background-color: #8758FF;
            }

            .hover:bg-custom-hover {
                background-color: #8758FF;
            }
        }
    </style>
</head>

<body class="bg-custom-light flex justify-center items-center min-h-screen p-5">
    <div class="bg-custom-dark p-6 rounded-sm w-full max-w-md text-white">
        <h1 class="text-3xl font-bold text-center mb-8">Get Things Done !</h1>
        <div class="flex">
            <input type="text" id="todoInput" placeholder="What is the task today?"
                class="flex-1 p-3 border rounded-l-none border-[#8758FF] bg-custom-input text-gray-300 text-base focus:outline-none">
            <button type="button" id="addBtn"
                class="px-6 py-3 bg-[#8758FF] rounded-l-none text-white font-medium hover:bg-[#5a2de6] transition-colors cursor-pointer">Add
                Task</button>
        </div>
        <ul id="todoList" class="mt-6 space-y-2"></ul>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
