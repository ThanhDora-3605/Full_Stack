<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Blogs</title>
</head>

<body>
    <main class="container mx-auto">
        <h1 class="text-2xl font-bold text-center mt-10">Blogs</h1>
        <div class="w-full my-2">
            <input type="text" id="js-search-input"
                class="w-full p-2 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-gray-500 shadow-lg transition duration-200 hover:bg-white/25 font-semibold select-none outline-none focus:border-blue-500"
                placeholder="Search...">
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none my-2">Thêm
                mới</button>
        </div>
        <div class=" w-full flex items-center gap-4">
            <button
                class="px-6 py-2 rounded-xl bg-yellow-500/20 backdrop-blur-md border border-white/30 text-yellow-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-yellow-500/25 active:scale-95 font-semibold select-none">Mới
                nhất</button>
            <button
                class="px-6 py-2 rounded-xl bg-gray-500/20 backdrop-blur-md border border-white/30 text-gray-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-gray-500/25 active:scale-95 font-semibold select-none">Cũ
                nhất</button>
        </div>
        <div class=" w-full p-4">
            <div class="js-posts-container">

            </div>

        </div>
        <div class="js-loading-state text-center text-gray-500"></div>
        <div id="paginationContainer" class="mt-6">
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none">1</button>
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none">2</button>
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none">3</button>
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none">4</button>
            <button
                class="px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none">5</button>
        </div>
    </main>

    <div id="modalContainer"
        class="hidden fixed inset-0 close-modal bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div id="modalContent"
            class="w-full max-w-4xl px-8 py-6 rounded-xl bg-white backdrop-blur-md border border-black/30 text-blue-400 transition duration-200 font-semibold gap-4 border-gray-300 flex flex-col justify-between mb-1">
            <div class="flex flex-col gap-2 w-full z-999">
                <h2 class="js-title text-2xl font-bold"></h2>
                <hr>
                <p class="js-body text-black/50 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
