<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20%;
        }

        .up {
            color: green;
        }

        .down {
            color: red;
        }

        .up,
        .down {
            font-size: 1.8rem;
            cursor: pointer;
        }

        .selected {
            border: 1px dashed green;
        }

        ul {
            list-style: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 1px solid red;
        }

        ul li {
            user-select: none;
            margin: 10px 15px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 2.2rem;
        }

        #menu {
            width: 100px;
            position: absolute;
            background: #ddd;
            display: none;
            padding: 5px;
        }

        #menu div:hover {
            cursor: pointer;
            color: red;
        }

        #overlay {
            visibility: hidden;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }

        .rename-box {
            padding: 10px;
            background: #cdcdcd;
            margin: 50px auto;
            display: flex;
            gap: 10px;
            width: 220px;
        }
    </style>
</head>

<body>
    <div class="container">

        <ul>
            <li>Item 1 <span class="up">Up</span> <span class="down">Down</span></li>
            <li>Item 2 <span class="up">Up</span> <span class="down">Down</span></li>
            <li>Item 3 <span class="up">Up</span> <span class="down">Down</span></li>
            <li>Item 4 <span class="up">Up</span> <span class="down">Down</span></li>
            <li>Item 5 <span class="up">Up</span> <span class="down">Down</span></li>
        </ul>
        <div id="menu">
            <div id="rename">Đổi tên</div>
            <div id="delete">Xóa</div>
        </div>

        <div id="overlay">
            <div class="rename-box">
                <input type="text" id="nameInput" />
                <button id="saveRename">Lưu</button>
            </div>
        </div>
    </div>
    <script src="./js/script.js"></script>
</body>

</html>
