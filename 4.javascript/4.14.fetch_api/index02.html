<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Blogs</title>
</head>

<body>
    <main class="container mx-auto">
        <h1 class="text-2xl font-bold text-center mt-10">Blogs</h1>
        <div class="w-full my-2">
            <input type="text" id="js-search-input"
                class="w-full p-2 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 text-gray-500 shadow-lg transition duration-200 hover:bg-white/25 font-semibold select-none outline-none focus:border-blue-500"
                placeholder="Search...">
            <button
                class="js-add-new px-6 py-2 rounded-xl bg-blue-500/20 backdrop-blur-md border border-white/30 text-blue-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-blue-500/25 active:scale-95 font-semibold select-none my-2">Thêm
                mới</button>
        </div>
        <div class=" w-full flex items-center gap-4">
            <button
                class="js-sort-newest px-6 py-2 rounded-xl bg-yellow-500/20 backdrop-blur-md border border-white/30 text-yellow-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-yellow-500/25 active:scale-95 font-semibold select-none">Mới
                nhất</button>
            <button
                class="js-sort-oldest px-6 py-2 rounded-xl bg-gray-500/20 backdrop-blur-md border border-white/30 text-gray-500 shadow-lg transition duration-200 hover:-translate-y-0.5 hover:bg-gray-500/25 active:scale-95 font-semibold select-none">Cũ
                nhất</button>
        </div>
        <div class=" w-full p-4">
            <div class="js-posts-container">

            </div>

        </div>
        <div class="js-loading-state text-center text-gray-500"></div>
        <div id="paginationContainer" class="mt-6 flex gap-2 flex-wrap"></div>
    </main>

    <div id="modalContainer"
        class="hidden fixed inset-0 close-modal bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div id="modalContent"
            class="px-6 py-2 rounded-xl bg-white backdrop-blur-md border border-black/30 text-blue-400 transition duration-200 font-semibold p-4 gap-4 border-gray-300 flex flex-col justify-between mb-1 relative max-w-2xl w-full">
            <button
                class="close-modal absolute top-2 right-5 text-gray-500 hover:text-gray-700 transition duration-200 text-2xl">&times;</button>
            <div class="flex flex-col gap-2 w-full z-999">
                <h2 class="js-title text-2xl font-bold"></h2>
                <hr>
                <p class="js-body text-black/50 text-sm leading-relaxed"></p>
            </div>
        </div>
    </div>

    <div id="formModalContainer"
        class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div id="formModalContent"
            class="px-6 py-4 rounded-xl bg-white backdrop-blur-md border border-black/30 transition duration-200 font-semibold p-4 gap-4 border-gray-300 flex flex-col justify-between mb-1 relative max-w-2xl w-full">
            <button
                class="close-form-modal absolute top-2 right-5 text-gray-500 hover:text-gray-700 transition duration-200 text-2xl">&times;</button>
            <h2 id="formModalTitle" class="text-2xl font-bold mb-4">Thêm bài viết mới</h2>
            <form id="postForm" class="flex flex-col gap-4">
                <div class="flex flex-col gap-2">
                    <label class="font-semibold">Tiêu đề</label>
                    <input type="text" id="formTitle" required
                        class="w-full p-2 rounded-xl border border-gray-300 outline-none focus:border-blue-500">
                </div>
                <div class="flex flex-col gap-2">
                    <label class="font-semibold">Nội dung</label>
                    <textarea id="formBody" required rows="6"
                        class="w-full p-2 rounded-xl border border-gray-300 outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="flex gap-2 justify-end">
                    <button type="button" class="close-form-modal px-6 py-2 rounded-xl bg-gray-500/20 text-gray-500 hover:bg-gray-500/25 transition duration-200">Hủy</button>
                    <button type="submit" class="px-6 py-2 rounded-xl bg-blue-500 text-white hover:bg-blue-600 transition duration-200">Lưu</button>
                </div>
            </form>
        </div>
    </div>
    <script src="./js/script02.js"></script>
</body>

</html>
