# Use root/example as user/password credentials

services:
  db:
    container_name: "dora_db"
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "306205"
    # (this is just an example, not intended to be a production configuration)
    ports:
      - 3307:3306
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

