<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style_B2.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>Flash Sales</title>
</head>

<body>
    <div class="container">
        <div class="flash-sale-container">
            <div class="title-text-today">
                <div class="red-bar"></div>
                <span class="today">Today's</span>
            </div>
            <div class="flash-sale-header">
                <div class="title-section">
                    <div class="title-text">
                        <h1>Flash Sales</h1>
                    </div>
                </div>

                <div class="countdown-section">
                    <div class="countdown-item">
                        <span class="number">03</span>
                        <span class="label">Days</span>
                    </div>
                    <span class="separator">:</span>
                    <div class="countdown-item">
                        <span class="number">23</span>
                        <span class="label">Hours</span>
                    </div>
                    <span class="separator">:</span>
                    <div class="countdown-item">
                        <span class="number">19</span>
                        <span class="label">Minutes</span>
                    </div>
                    <span class="separator">:</span>
                    <div class="countdown-item">
                        <span class="number">56</span>
                        <span class="label">Seconds</span>
                    </div>
                </div>

                <div class="navigation-buttons">
                    <button class="nav-btn"><i class="fas fa-arrow-left"></i></button>
                    <button class="nav-btn"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <!-- Products Section -->
            <div class="products-grid">
                <!-- Product 1: Gamepad -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="discount-badge">-40%</div>
                        <div class="action-buttons">
                            <button class="action-btn"><i class="far fa-heart"></i></button>
                            <button class="action-btn"><i class="far fa-eye"></i></button>
                        </div>
                        <img src="./images/HAVIT HV-G92 Gamepad.jpeg" alt="HAVIT HV-G92 Gamepad">
                        <div class="hover-overlay">
                            <button class="add-to-cart-btn">Add To Cart</button>
                        </div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">HAVIT HV-G92 Gamepad</h3>
                        <div class="price-section">
                            <span class="current-price">$120</span>
                            <span class="original-price">$160</span>
                        </div>
                        <div class="rating-section">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            <span class="review-count">(88)</span>
                        </div>
                    </div>
                </div>

                <!-- Product 2: Keyboard -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="discount-badge">-35%</div>
                        <div class="action-buttons">
                            <button class="action-btn"><i class="far fa-heart"></i></button>
                            <button class="action-btn"><i class="far fa-eye"></i></button>
                        </div>
                        <img src="./images/AK-900 Wired Keyboard.jpg" alt="AK-900 Wired Keyboard">
                        <div class="hover-overlay">
                            <button class="add-to-cart-btn">Add To Cart</button>
                        </div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">AK-900 Wired Keyboard</h3>
                        <div class="price-section">
                            <span class="current-price">$960</span>
                            <span class="original-price">$1160</span>
                        </div>
                        <div class="rating-section">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            <span class="review-count">(75)</span>
                        </div>
                    </div>
                </div>

                <!-- Product 3: Monitor -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="discount-badge">-30%</div>
                        <div class="action-buttons">
                            <button class="action-btn"><i class="far fa-heart"></i></button>
                            <button class="action-btn"><i class="far fa-eye"></i></button>
                        </div>
                        <img src="./images/IPS LCD Gaming Monitor.jpeg" alt="IPS LCD Gaming Monitor">
                        <div class="hover-overlay">
                            <button class="add-to-cart-btn">Add To Cart</button>
                        </div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">IPS LCD Gaming Monitor</h3>
                        <div class="price-section">
                            <span class="current-price">$370</span>
                            <span class="original-price">$400</span>
                        </div>
                        <div class="rating-section">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            <span class="review-count">(99)</span>
                        </div>
                    </div>
                </div>

                <!-- Product 4: Chair -->
                <div class="product-card">
                    <div class="product-image">
                        <div class="discount-badge">-25%</div>
                        <div class="action-buttons">
                            <button class="action-btn"><i class="far fa-heart"></i></button>
                            <button class="action-btn"><i class="far fa-eye"></i></button>
                        </div>
                        <img src="./images/S-Series Comfort Chair.jpeg" alt="S-Series Comfort Chair">
                        <div class="hover-overlay">
                            <button class="add-to-cart-btn">Add To Cart</button>
                        </div>
                    </div>
                    <div class="product-details">
                        <h3 class="product-title">S-Series Comfort Chair</h3>
                        <div class="price-section">
                            <span class="current-price">$375</span>
                            <span class="original-price">$400</span>
                        </div>
                        <div class="rating-section">
                            <div class="stars">
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                                <i class="fas fa-star"></i>
                            </div>
                            <span class="review-count">(99)</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- View All Button -->
            <div class="view-all-section">
                <button class="view-all-btn">View All Products</button>
            </div>
        </div>
    </div>
</body>

</html>
